
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Arogya Patra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f7f5;
            color: #233b36;
        }

        .header {
            min-height: 74px;
            padding: 12px clamp(18px, 3vw, 42px);
            background: #176b5b;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .brand {
            color: inherit;
            text-decoration: none;
            font-size: 1.65rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-account {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .patient-summary {
            text-align: right;
            line-height: 1.35;
        }

        .patient-summary strong,
        .patient-summary span {
            display: block;
        }

        .patient-summary strong { font-size: 1rem; }
        .patient-summary > span { color: #d3ebe4; font-size: 0.82rem; }
        .patient-summary > span > span { display: inline; }

        .menu-wrap { position: relative; }

        .menu-toggle {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 10px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: grid;
            place-content: center;
            gap: 5px;
        }

        .menu-toggle span {
            display: block;
            width: 19px;
            height: 2px;
            border-radius: 2px;
            background: currentColor;
        }

        .menu-dropdown {
            position: absolute;
            z-index: 5;
            top: calc(100% + 10px);
            right: 0;
            width: 190px;
            padding: 6px;
            border: 1px solid #dce8e4;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 14px 30px rgba(26, 59, 50, 0.16);
        }

        .menu-dropdown[hidden] { display: none; }

        .menu-dropdown a,
        .menu-dropdown button {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #244b42;
            text-align: left;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .menu-dropdown a:hover,
        .menu-dropdown button:hover { background: #edf5f2; }

        .drawer-backdrop {
            position: fixed;
            z-index: 20;
            inset: 0;
            display: flex;
            justify-content: flex-end;
            background: rgba(15, 34, 29, 0.4);
        }

        .drawer-backdrop[hidden] { display: none; }

        .side-drawer {
            width: min(460px, 100%);
            height: 100%;
            overflow-y: auto;
            padding: 24px;
            background: #fff;
            box-shadow: -16px 0 42px rgba(10, 42, 33, 0.18);
            animation: drawer-in 0.22s ease-out both;
        }

        .side-drawer.preview-drawer {
            display: flex;
            flex-direction: column;
            width: min(1100px, 100%);
            overflow: hidden;
            padding: 0;
        }

        .preview-drawer .drawer-heading {
            flex: 0 0 auto;
            margin: 0;
            padding: 14px 22px;
            border-bottom: 1px solid #e1ebe7;
        }

        .preview-frame {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 0;
            flex: 1;
            border: 0;
            background: #f4f7fb;
        }

        @keyframes drawer-in {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .drawer-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .drawer-heading h2 { color: #176b5b; font-size: 1.3rem; }

        .drawer-close {
            width: 40px;
            height: 40px;
            border: 1px solid #d5e4de;
            border-radius: 50%;
            background: #fff;
            color: #35584e;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .drawer-panel[hidden] { display: none; }

        .drawer-panel.preview-panel {
            display: flex;
            flex: 1 1 auto;
            min-height: 0;
        }

        .drawer-panel.preview-panel[hidden] { display: none; }

        .profile-detail {
            margin-bottom: 12px;
            padding: 14px;
            border-radius: 8px;
            background: #f1f7f5;
        }

        .profile-detail span {
            display: block;
            margin-bottom: 5px;
            color: #6a7c75;
            font-size: 0.82rem;
        }

        .profile-detail strong { color: #24574a; overflow-wrap: anywhere; }

        .drawer-form label {
            display: block;
            margin: 15px 0 7px;
            color: #435a53;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .drawer-form input,
        .drawer-form select {
            width: 100%;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #cbdcd6;
            border-radius: 7px;
            background: #fff;
            color: #263d36;
            font: inherit;
        }

        .drawer-form input[type="file"] { min-height: 0; padding: 10px; }
        .drawer-note { margin-top: 6px; color: #71817c; font-size: 0.82rem; }

        .drawer-primary,
        .drawer-secondary {
            min-height: 42px;
            margin: 18px 8px 0 0;
            padding: 0 16px;
            border: 0;
            border-radius: 7px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .drawer-primary { background: #176b5b; color: #fff; }
        .drawer-secondary { background: #edf5f2; color: #315a4f; }
        .drawer-primary:disabled { opacity: 0.6; cursor: wait; }

        .drawer-message {
            min-height: 22px;
            margin-top: 14px;
            color: #a53131;
            font-size: 0.9rem;
        }

        .drawer-message.success { color: #176b5b; }

        .container {
            width: 100%;
            max-width: none;
            margin: 30px 0;
            padding: 0 clamp(18px, 3vw, 48px);
        }

        .welcome { margin-bottom: 30px; }

        .welcome h1 {
            margin-bottom: 8px;
            color: #176b5b;
            font-size: clamp(1.7rem, 3vw, 2.2rem);
        }

        .welcome p { color: #62726d; font-size: 1rem; }

        .reports-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        .reports-heading h2 {
            color: #254c43;
            font-size: 1.25rem;
        }

        .report-period {
            margin-top: 6px;
            color: #71817c;
            font-size: 0.88rem;
        }

        .report-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-action {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 1px solid #c9ddd6;
            border-radius: 50%;
            background: #fff;
            color: #176b5b;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(23, 74, 62, 0.08);
        }

        .icon-action:hover { background: #e7f2ee; }

        .icon-action[aria-expanded="true"] { background: #e7f2ee; }

        .icon-action.add {
            width: 54px;
            height: 54px;
            border-color: #176b5b;
            background: #176b5b;
            color: #fff;
            font-size: 2rem;
            line-height: 1;
        }

        .icon-action.add:hover { background: #0f594b; }

        .filter-icon {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .filter-wrap { position: relative; }

        .filter-dropdown {
            position: absolute;
            z-index: 6;
            top: calc(100% + 10px);
            right: 0;
            width: min(320px, calc(100vw - 32px));
            padding: 16px;
            border: 1px solid #dce8e4;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 14px 30px rgba(26, 59, 50, 0.16);
        }

        .filter-dropdown[hidden] { display: none; }

        .filter-group { margin-bottom: 14px; }

        .filter-group label {
            display: block;
            margin-bottom: 7px;
            color: #435a53;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .filter-group select {
            width: 100%;
            min-height: 42px;
            padding: 8px 10px;
            border: 1px solid #cbdcd6;
            border-radius: 7px;
            background: #fbfdfc;
            color: #263d36;
            font: inherit;
        }

        .filter-actions {
            display: flex;
            gap: 9px;
            margin-top: 18px;
        }

        .filter-actions button {
            min-height: 40px;
            flex: 1;
            padding: 0 12px;
            border: 0;
            border-radius: 7px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .apply-filter { background: #176b5b; color: #fff; }
        .apply-filter:hover { background: #0f594b; }
        .reset-filter { background: #edf5f2; color: #315a4f; }
        .reset-filter:hover { background: #dcece6; }

        .filter-message {
            min-height: 22px;
            margin: -8px 0 14px;
            color: #a53131;
            font-size: 0.9rem;
        }

        .filter-message:empty { display: none; }
        .filter-message.success { color: #176b5b; }

        .report-grid {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #e1ebe7;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(31, 68, 57, 0.07);
        }

        .report-table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            text-align: left;
        }

        .report-table th,
        .report-table td {
            padding: 15px 16px;
            border-bottom: 1px solid #e8efec;
            vertical-align: middle;
        }

        .report-table th {
            background: #f5f9f7;
            color: #546962;
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .report-table td { color: #304941; font-size: 0.92rem; }
        .report-table tbody tr:last-child td { border-bottom: 0; }
        .report-table tbody tr:hover { background: #fbfdfc; }

        .file-actions,
        .row-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-button {
            width: 36px;
            height: 36px;
            display: inline-grid;
            flex: 0 0 36px;
            place-items: center;
            border: 1px solid #d5e4de;
            border-radius: 8px;
            background: #fff;
            color: #176b5b;
            cursor: pointer;
        }

        .icon-button:hover { background: #edf5f2; }

        .icon-button svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-button.delete { color: #ad3b38; }
        .icon-button.delete:hover { border-color: #efcfcd; background: #fff3f2; }

        .empty-state {
            padding: 42px 20px;
            color: #687a73;
            text-align: center;
        }

        @media (max-width: 620px) {
            .header { gap: 12px; }
            .brand { font-size: 1.25rem; }
            .header-account { gap: 10px; }
            .patient-summary strong { max-width: 145px; overflow-wrap: anywhere; font-size: 0.9rem; }
            .container { width: 100%; margin: 20px 0; padding: 0 14px; }
            .reports-heading { align-items: flex-start; }
        }

        @media (max-width: 380px) {
            .patient-summary span { font-size: 0.72rem; }
            .menu-toggle { width: 40px; height: 40px; }
            .icon-action { width: 44px; height: 44px; }
            .icon-action.add { width: 50px; height: 50px; }
        }
    </style>
</head>

<body>

    <header class="header">
        <a class="brand" href="dashboard.html">🏥 Arogya Patra</a>

        <div class="header-account">
            <div class="patient-summary" aria-label="Signed-in patient">
                <strong id="patientName">Patient</strong>
                <span>ID: <span id="patientId">Not available</span></span>
            </div>

            <div class="menu-wrap">
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open account menu" aria-expanded="false" aria-controls="accountMenu">
                    <span></span><span></span><span></span>
                </button>
                <nav class="menu-dropdown" id="accountMenu" aria-label="Account menu" hidden>
                    <button id="openProfile" type="button">My Profile</button>
                    <button type="button" onclick="logout()">Logout</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="reportsTitle">
            <div class="reports-heading">
                <div>
                    <h2 id="reportsTitle">Your medical reports</h2>
                    <p class="report-period" id="reportPeriod">Loading reports from the last month...</p>
                </div>
                <div class="report-actions">
                    <div class="filter-wrap">
                        <button class="icon-action" id="filterToggle" type="button" aria-label="Filter reports" title="Filter reports" aria-expanded="false" aria-controls="filterPanel">
                            <svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6.2 7.1v5.1l-3.6 1.8v-6.9L4 5z"></path></svg>
                        </button>
                        <div class="filter-dropdown" id="filterPanel" aria-label="Report filters" hidden>
                            <div class="filter-group">
                                <label for="periodFilter">Time period</label>
                                <select id="periodFilter">
                                    <option value="1" selected>Last 1 month</option>
                                    <option value="2">Last 2 months</option>
                                    <option value="3">Last 3 months</option>
                                    <option value="6">Last 6 months</option>
                                    <option value="12">Last 1 year</option>
                                    <option value="24">Last 2 years</option>
                                    <option value="all">All time</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label for="testFilter">Test type</label>
                                <select id="testFilter">
                                    <option value="all">All tests</option>
                                </select>
                            </div>
                            <div class="filter-actions">
                                <button class="apply-filter" id="applyFilter" type="button">Apply</button>
                                <button class="reset-filter" id="resetFilter" type="button">Reset</button>
                            </div>
                        </div>
                    </div>
                    <button class="icon-action add" id="openAddReport" type="button" aria-label="Add report" title="Add report">+</button>
                </div>
            </div>

            <p class="filter-message" id="filterMessage" aria-live="polite"></p>
            <div class="report-grid" id="reportGrid" aria-live="polite">
                <p class="empty-state">Loading reports...</p>
            </div>
        </section>
    </main>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden>
        <aside class="side-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
            <div class="drawer-heading">
                <h2 id="drawerTitle">My Profile</h2>
                <button class="drawer-close" id="closeDrawer" type="button" aria-label="Close panel">×</button>
            </div>

            <section class="drawer-panel" id="profilePanel">
                <div class="profile-detail"><span>Patient name</span><strong id="profileName">Loading...</strong></div>
                <div class="profile-detail"><span>Arogya Patra ID</span><strong id="profileId">Loading...</strong></div>
                <div class="profile-detail"><span>Registered mobile number</span><strong id="profileMobile">Loading...</strong></div>
                <form class="drawer-form" id="profileForm" novalidate hidden>
                    <label for="editName">Patient name</label>
                    <input id="editName" type="text" autocomplete="name" required>
                    <label for="editMobile">Mobile number</label>
                    <input id="editMobile" type="tel" maxlength="10" inputmode="numeric" autocomplete="tel" required>
                    <button class="drawer-primary" type="submit">Save changes</button>
                    <button class="drawer-secondary" id="cancelProfileEdit" type="button">Cancel</button>
                </form>
                <p class="drawer-message" id="profileMessage" aria-live="polite"></p>
                <button class="drawer-primary" id="editProfile" type="button">Edit profile</button>
            </section>

            <section class="drawer-panel" id="addReportPanel" hidden>
                <form class="drawer-form" id="reportForm" novalidate>
                    <p class="drawer-message" id="addReportMessage" aria-live="polite"></p>
                    <label for="hospital">Hospital name</label>
                    <input id="hospital" type="text" placeholder="Enter hospital name" required>

                    <label for="doctor">Doctor name</label>
                    <input id="doctor" type="text" placeholder="Enter doctor name" required>

                    <label for="testName">Test name</label>
                    <select id="testName" required>
                        <option value="">Select a test</option>
                        <option>Blood Test</option>
                        <option>MRI</option>
                        <option>ECG</option>
                        <option>2D-3D Echo</option>
                        <option>X-Ray</option>
                        <option>CT Scan</option>
                        <option>Ultrasound</option>
                        <option>Other</option>
                    </select>
                    <label for="customTest">Custom test name</label>
                    <input id="customTest" type="text" placeholder="Enter test name" disabled>

                    <label for="visitDate">Visit date</label>
                    <input id="visitDate" type="date" required>

                    <label for="reports">Medical report files</label>
                    <input id="reports" type="file" multiple required>
                    <p class="drawer-note" id="fileInfo">You can select multiple files for this test.</p>

                    <button class="drawer-primary" id="saveReport" type="submit">Save reports</button>
                </form>
            </section>

            <section class="drawer-panel preview-panel" id="previewPanel" hidden>
                <iframe class="preview-frame" id="previewFrame" title="Report preview and voice assistant" allow="microphone; autoplay"></iframe>
            </section>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const patientName = localStorage.getItem("patientName");
        const patientId = localStorage.getItem("patientId");
        const reportGrid = document.getElementById("reportGrid");
        const reportPeriod = document.getElementById("reportPeriod");
        const filterPanel = document.getElementById("filterPanel");
        const filterToggle = document.getElementById("filterToggle");
        const periodFilter = document.getElementById("periodFilter");
        const testFilter = document.getElementById("testFilter");
        const filterMessage = document.getElementById("filterMessage");
        const drawerBackdrop = document.getElementById("drawerBackdrop");
        const drawerTitle = document.getElementById("drawerTitle");
        const profilePanel = document.getElementById("profilePanel");
        const addReportPanel = document.getElementById("addReportPanel");
        const previewPanel = document.getElementById("previewPanel");
        const previewFrame = document.getElementById("previewFrame");
        const profileForm = document.getElementById("profileForm");
        const profileMessage = document.getElementById("profileMessage");
        const reportForm = document.getElementById("reportForm");
        const addReportMessage = document.getElementById("addReportMessage");
        const testNameInput = document.getElementById("testName");
        const customTestInput = document.getElementById("customTest");
        const reportFilesInput = document.getElementById("reports");
        const fileInfo = document.getElementById("fileInfo");
        const saveReportButton = document.getElementById("saveReport");
        let allReports = [];
        let currentProfile = null;
        let drawerTrigger = null;

        if (patientName && patientId) {
            document.getElementById("patientName").innerText = patientName;
            document.getElementById("patientId").innerText = patientId;
        }

        const menuToggle = document.getElementById("menuToggle");
        const accountMenu = document.getElementById("accountMenu");

        menuToggle.addEventListener("click", () => {
            const isExpanded = menuToggle.getAttribute("aria-expanded") === "true";
            menuToggle.setAttribute("aria-expanded", String(!isExpanded));
            accountMenu.hidden = isExpanded;
            if (!isExpanded) closeFilterMenu();
        });

        document.addEventListener("click", event => {
            if (!event.target.closest(".menu-wrap")) {
                menuToggle.setAttribute("aria-expanded", "false");
                accountMenu.hidden = true;
            }

            if (!event.target.closest(".filter-wrap")) closeFilterMenu();
            if (event.target === drawerBackdrop) closeDrawer();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                menuToggle.setAttribute("aria-expanded", "false");
                accountMenu.hidden = true;
                closeFilterMenu();
                closeDrawer();
            }
        });

        document.getElementById("openProfile").addEventListener("click", event => {
            openDrawer("profile", event.currentTarget);
        });

        document.getElementById("openAddReport").addEventListener("click", event => {
            openDrawer("add", event.currentTarget);
        });

        document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
        document.getElementById("editProfile").addEventListener("click", startProfileEdit);
        document.getElementById("cancelProfileEdit").addEventListener("click", cancelProfileEdit);
        profileForm.addEventListener("submit", saveProfile);

        function openDrawer(panel, trigger) {
            closeFilterMenu();
            accountMenu.hidden = true;
            menuToggle.setAttribute("aria-expanded", "false");
            drawerTrigger = trigger;
            profilePanel.hidden = panel !== "profile";
            addReportPanel.hidden = panel !== "add";
            previewPanel.hidden = panel !== "preview";
            document.querySelector(".side-drawer").classList.toggle("preview-drawer", panel === "preview");
            drawerTitle.textContent = panel === "profile"
                ? "My Profile"
                : panel === "add" ? "Add Medical Report" : "Report preview and voice assistant";
            drawerBackdrop.hidden = false;
            document.body.style.overflow = "hidden";
            document.getElementById("closeDrawer").focus();

            if (panel === "profile") {
                loadProfile();
            } else if (panel === "add") {
                reportForm.reset();
                customTestInput.disabled = true;
                customTestInput.required = false;
                document.getElementById("visitDate").value = new Date().toLocaleDateString("en-CA");
                fileInfo.textContent = "You can select multiple files for this test.";
                addReportMessage.textContent = "";
                addReportMessage.classList.remove("success");
            }
        }

        function closeDrawer() {
            if (drawerBackdrop.hidden) return;
            drawerBackdrop.hidden = true;
            document.body.style.overflow = "";
            previewFrame.src = "about:blank";
            if (drawerTrigger) drawerTrigger.focus();
        }

        async function loadProfile() {
            profileMessage.textContent = "";
            profileMessage.classList.remove("success");
            if (!patientId) {
                profileMessage.textContent = "Sign in to view your profile.";
                document.getElementById("editProfile").disabled = true;
                return;
            }

            try {
                const response = await fetch(`/profile/${encodeURIComponent(patientId)}`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Could not load profile.");

                currentProfile = data;
                document.getElementById("profileName").textContent = data.name;
                document.getElementById("profileId").textContent = data.user_id;
                document.getElementById("profileMobile").textContent = data.mobile;
                document.getElementById("editName").value = data.name;
                document.getElementById("editMobile").value = data.mobile;
                document.getElementById("editProfile").disabled = false;
            } catch (error) {
                profileMessage.textContent = error.message || "Could not load profile.";
            }
        }

        function startProfileEdit() {
            if (!currentProfile) return;
            profileForm.hidden = false;
            document.getElementById("editProfile").hidden = true;
            profileMessage.textContent = "";
            document.getElementById("editName").focus();
        }

        function cancelProfileEdit() {
            if (currentProfile) {
                document.getElementById("editName").value = currentProfile.name;
                document.getElementById("editMobile").value = currentProfile.mobile;
            }
            profileForm.hidden = true;
            document.getElementById("editProfile").hidden = false;
            profileMessage.textContent = "";
        }

        async function saveProfile(event) {
            event.preventDefault();
            const name = document.getElementById("editName").value.trim();
            const mobile = document.getElementById("editMobile").value.trim();
            profileMessage.classList.remove("success");

            if (!name) {
                profileMessage.textContent = "Enter your name.";
                return;
            }
            if (!/^\d{10}$/.test(mobile)) {
                profileMessage.textContent = "Enter a valid 10-digit mobile number.";
                return;
            }

            try {
                const response = await fetch(`/profile/${encodeURIComponent(patientId)}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, mobile })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Could not update profile.");

                currentProfile = { ...currentProfile, name, mobile };
                localStorage.setItem("patientName", name);
                document.getElementById("patientName").textContent = name;
                document.getElementById("profileName").textContent = name;
                document.getElementById("profileMobile").textContent = mobile;
                profileForm.hidden = true;
                document.getElementById("editProfile").hidden = false;
                profileMessage.textContent = "Profile updated successfully.";
                profileMessage.classList.add("success");
            } catch (error) {
                profileMessage.textContent = error.message || "Could not update profile.";
            }
        }

        testNameInput.addEventListener("change", () => {
            const isCustomTest = testNameInput.value === "Other";
            customTestInput.disabled = !isCustomTest;
            customTestInput.required = isCustomTest;
            if (!isCustomTest) customTestInput.value = "";
        });

        reportFilesInput.addEventListener("change", () => {
            const count = reportFilesInput.files.length;
            fileInfo.textContent = count
                ? `${count} report file${count === 1 ? "" : "s"} selected.`
                : "You can select multiple files for this test.";
        });

        reportForm.addEventListener("submit", async event => {
            event.preventDefault();
            addReportMessage.classList.remove("success");
            addReportMessage.textContent = "";

            if (!patientId) {
                addReportMessage.textContent = "Sign in before adding a report.";
                return;
            }

            const selectedTest = testNameInput.value === "Other"
                ? customTestInput.value.trim()
                : testNameInput.value;
            const hospital = document.getElementById("hospital").value.trim();
            const doctor = document.getElementById("doctor").value.trim();
            const visitDate = document.getElementById("visitDate").value;

            if (!hospital) {
                addReportMessage.textContent = "Enter the hospital name.";
                document.getElementById("hospital").focus();
                return;
            }
            if (!doctor) {
                addReportMessage.textContent = "Enter the doctor name.";
                document.getElementById("doctor").focus();
                return;
            }
            if (!testNameInput.value) {
                addReportMessage.textContent = "Select a test.";
                testNameInput.focus();
                return;
            }
            if (!selectedTest) {
                addReportMessage.textContent = "Select a test or enter a custom test name.";
                customTestInput.focus();
                return;
            }
            if (!visitDate) {
                addReportMessage.textContent = "Choose the visit date.";
                document.getElementById("visitDate").focus();
                return;
            }
            if (reportFilesInput.files.length === 0) {
                addReportMessage.textContent = "Select at least one report file.";
                reportFilesInput.focus();
                return;
            }

            const formData = new FormData();
            formData.append("userId", patientId);
            formData.append("hospital", hospital);
            formData.append("doctor", doctor);
            formData.append("testName", selectedTest);
            formData.append("visitDate", visitDate);
            [...reportFilesInput.files].forEach(file => formData.append("reports", file));

            saveReportButton.disabled = true;
            saveReportButton.textContent = "Saving...";
            try {
                const response = await fetch("/save-report", { method: "POST", body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Could not save report.");

                addReportMessage.textContent = `Saved successfully: ${data.reportName}`;
                addReportMessage.classList.add("success");
                reportForm.reset();
                customTestInput.disabled = true;
                customTestInput.required = false;
                fileInfo.textContent = "You can select multiple files for this test.";
                document.getElementById("visitDate").value = new Date().toLocaleDateString("en-CA");
                await loadReports();
            } catch (error) {
                addReportMessage.textContent = error.message || "Could not connect to the server.";
            } finally {
                saveReportButton.disabled = false;
                saveReportButton.textContent = "Save reports";
            }
        });

        function closeFilterMenu() {
            filterToggle.setAttribute("aria-expanded", "false");
            filterPanel.hidden = true;
        }

        function formatReportDate(value) {
            const date = new Date(`${value}T00:00:00`);
            return Number.isNaN(date.getTime())
                ? value || "Date unavailable"
                : new Intl.DateTimeFormat(undefined, { dateStyle: "medium" }).format(date);
        }

        function groupReports(rows) {
            const grouped = new Map();

            rows.forEach(row => {
                if (!grouped.has(row.report_id)) {
                    grouped.set(row.report_id, {
                        reportId: row.report_id,
                        userId: row.user_id,
                        hospital: row.hospital,
                        doctor: row.doctor,
                        testName: row.test_name,
                        visitDate: row.visit_date,
                        files: []
                    });
                }

                const report = grouped.get(row.report_id);
                if (row.file_id) {
                    report.files.push({ name: row.file_name, path: row.file_path });
                }
            });

            return [...grouped.values()];
        }

        function populateTestFilter() {
            const previousValue = testFilter.value || "all";
            const tests = new Map();

            allReports.forEach(report => {
                const name = (report.testName || "").trim();
                const key = name.toLowerCase();
                if (key && !tests.has(key)) tests.set(key, name);
            });

            testFilter.replaceChildren(new Option("All tests", "all"));
            [...tests.values()].sort((first, second) => first.localeCompare(second)).forEach(name => {
                testFilter.add(new Option(name, name));
            });

            if ([...testFilter.options].some(option => option.value === previousValue)) {
                testFilter.value = previousValue;
            }
        }

        function createTextElement(tagName, className, text) {
            const element = document.createElement(tagName);
            if (className) element.className = className;
            element.textContent = text || "Not provided";
            return element;
        }

        function createIconSvg(paths) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            paths.forEach(pathValue => {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", pathValue);
                svg.appendChild(path);
            });
            return svg;
        }

        function openReportPreview(report, file, trigger) {
            const query = new URLSearchParams({
                file: file.path || "",
                name: file.name || "Medical Report",
                reportId: String(report.reportId),
                userId: report.userId || patientId,
                embedded: "1"
            });
            previewFrame.src = `/report-viewer.html?${query.toString()}`;
            openDrawer("preview", trigger);
        }

        function createReportTable(reports) {
            reportGrid.replaceChildren();
            if (reports.length === 0) {
                reportGrid.appendChild(createTextElement("p", "empty-state", "No reports found for these filters."));
                return;
            }

            const table = document.createElement("table");
            table.className = "report-table";
            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");
            ["Hospital", "Test", "Doctor", "Visit date", "Files", "Actions"].forEach(label => {
                const th = document.createElement("th");
                th.scope = "col";
                th.textContent = label;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);
            const tbody = document.createElement("tbody");

            reports.forEach(report => {
                const row = document.createElement("tr");
                [report.hospital, report.testName, report.doctor, formatReportDate(report.visitDate)].forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value || "Not provided";
                    row.appendChild(td);
                });

                const filesCell = document.createElement("td");
                const fileActions = document.createElement("div");
                fileActions.className = "file-actions";
                if (report.files.length === 0) {
                    fileActions.textContent = "No files";
                } else {
                    report.files.forEach(file => {
                        const previewButton = document.createElement("button");
                        previewButton.type = "button";
                        previewButton.className = "icon-button";
                        previewButton.title = `Preview ${file.name || "report"} with voice assistant`;
                        previewButton.setAttribute("aria-label", `Preview ${file.name || "report"} with voice assistant`);
                        previewButton.appendChild(createIconSvg([
                            "M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z",
                            "M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"
                        ]));
                        previewButton.addEventListener("click", () => openReportPreview(report, file, previewButton));
                        fileActions.appendChild(previewButton);

                        const link = document.createElement("a");
                        link.className = "icon-button";
                        link.href = `/uploads/${encodeURIComponent(file.path)}`;
                        link.download = file.name || "medical-report";
                        link.title = `Download ${file.name || "report"}`;
                        link.setAttribute("aria-label", `Download ${file.name || "report"}`);
                        link.appendChild(createIconSvg(["M12 3v12m0 0 4-4m-4 4-4-4", "M5 17v3h14v-3"]));
                        fileActions.appendChild(link);
                    });
                }
                filesCell.appendChild(fileActions);
                row.appendChild(filesCell);

                const actionsCell = document.createElement("td");
                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "icon-button delete";
                deleteButton.title = "Delete report";
                deleteButton.setAttribute("aria-label", `Delete report from ${report.hospital || "this hospital"}`);
                deleteButton.appendChild(createIconSvg(["M3 6h18", "M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"]));
                deleteButton.addEventListener("click", () => deleteReport(report.reportId));
                actionsCell.appendChild(deleteButton);
                row.appendChild(actionsCell);
                tbody.appendChild(row);
            });

            table.appendChild(tbody);
            reportGrid.appendChild(table);
        }

        async function deleteReport(reportId) {
            const report = allReports.find(item => Number(item.reportId) === Number(reportId));
            const hospital = report?.hospital || "this report";
            const confirmationText = `Delete the report from ${hospital} and all its attached files? This cannot be undone.`;
            const confirmation = typeof Swal !== "undefined"
                ? await Swal.fire({
                    title: "Delete this report?",
                    text: confirmationText,
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#ad3b38",
                    cancelButtonColor: "#63736e",
                    confirmButtonText: "Delete report",
                    cancelButtonText: "Cancel",
                    reverseButtons: true,
                    focusCancel: true
                })
                : { isConfirmed: window.confirm(confirmationText) };

            if (!confirmation.isConfirmed) return;

            filterMessage.textContent = "";
            try {
                const response = await fetch(`/delete-report/${encodeURIComponent(patientId)}/${encodeURIComponent(reportId)}`, { method: "DELETE" });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || "Could not delete report.");
                allReports = allReports.filter(item => Number(item.reportId) !== Number(reportId));
                populateTestFilter();
                applyFilters();
                filterMessage.textContent = "Report deleted.";
                filterMessage.classList.add("success");
            } catch (error) {
                filterMessage.textContent = error.message || "Could not delete report.";
            }
        }

        function applyFilters() {
            const period = periodFilter.value;
            const selectedTest = testFilter.value;
            filterMessage.classList.remove("success");
            filterMessage.textContent = "";
            let filteredReports = [...allReports];

            if (period !== "all") {
                const cutoff = new Date();
                cutoff.setHours(0, 0, 0, 0);
                cutoff.setMonth(cutoff.getMonth() - Number(period));

                filteredReports = filteredReports.filter(report => {
                    if (!report.visitDate) return false;
                    const visitDate = new Date(`${report.visitDate}T00:00:00`);
                    return !Number.isNaN(visitDate.getTime()) && visitDate >= cutoff;
                });
            }

            if (selectedTest !== "all") {
                filteredReports = filteredReports.filter(report =>
                    (report.testName || "").trim().toLowerCase() === selectedTest.toLowerCase()
                );
            }

            const periodLabels = {
                "1": "Last 1 month",
                "2": "Last 2 months",
                "3": "Last 3 months",
                "6": "Last 6 months",
                "12": "Last 1 year",
                "24": "Last 2 years",
                all: "All time"
            };
            const periodLabel = periodLabels[period] || "All time";
            const testLabel = selectedTest === "all" ? "All tests" : selectedTest;
            reportPeriod.textContent = `Showing ${filteredReports.length} report${filteredReports.length === 1 ? "" : "s"} · ${periodLabel} · ${testLabel}`;
            createReportTable(filteredReports);
        }

        async function loadReports() {
            if (!patientId) {
                reportPeriod.textContent = "Sign in to view your reports.";
                reportGrid.replaceChildren(createTextElement("p", "empty-state", "No patient account is active."));
                return;
            }

            try {
                const response = await fetch(`/fetch-reports/${encodeURIComponent(patientId)}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Could not load reports.");
                }

                allReports = groupReports(data);
                populateTestFilter();
                applyFilters();
            } catch (error) {
                reportPeriod.textContent = "Reports could not be loaded.";
                reportGrid.replaceChildren(createTextElement("p", "empty-state", error.message || "Could not load reports."));
            }
        }

        filterToggle.addEventListener("click", () => {
            const isExpanded = filterToggle.getAttribute("aria-expanded") === "true";
            filterToggle.setAttribute("aria-expanded", String(!isExpanded));
            filterPanel.hidden = isExpanded;
            if (!isExpanded) {
                menuToggle.setAttribute("aria-expanded", "false");
                accountMenu.hidden = true;
            }
        });

        document.getElementById("applyFilter").addEventListener("click", () => {
            applyFilters();
            closeFilterMenu();
        });
        document.getElementById("resetFilter").addEventListener("click", () => {
            periodFilter.value = "1";
            testFilter.value = "all";
            applyFilters();
            closeFilterMenu();
        });
        loadReports();

        const requestedDrawer = new URLSearchParams(window.location.search).get("drawer");
        if (requestedDrawer === "profile") {
            openDrawer("profile", document.getElementById("openProfile"));
        } else if (requestedDrawer === "add-report") {
            openDrawer("add", document.getElementById("openAddReport"));
        }

        function logout() {
            localStorage.removeItem("patientName");
            localStorage.removeItem("patientId");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Arogya Patra</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f8f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #176b5b;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #176b5b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .forgot {
            text-align: center;
            margin-top: 20px;
            color: #176b5b;
            cursor: pointer;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            color: #176b5b;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <p class="subtitle">
            Login to your Arogya Patra account
        </p>

        <label for="userId">
            Arogya Patra ID
        </label>

        <input
            type="text"
            id="userId"
            placeholder="Enter your Arogya Patra ID"
        >

        <button onclick="login()">
            Login
        </button>

        <p class="forgot" onclick="forgotId()">
    Forgot your Arogya Patra ID?
</p>

        <p class="back" onclick="window.location.href='index.html'">
            ← Back to Home
        </p>

    </div>


    <script>

        async function login() {

            const userId =
                document.getElementById("userId").value.trim();

            if (userId === "") {

                alert("Please enter your Arogya Patra ID.");

                return;
            }


            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        userId: userId
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    alert(data.message);

                    return;
                }


                localStorage.setItem("patientName", data.user.name);
localStorage.setItem("patientId", data.user.user_id);

window.location.href = "dashboard.html";

            } catch (error) {

                alert("Could not connect to the server.");

            }

        }

        async function forgotId() {
    const mobile = prompt("Enter your registered mobile number:");

    if (!mobile) return;

    if (!/^\d{10}$/.test(mobile.trim())) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    try {
        const response = await fetch("/forgot-id", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ mobile: mobile.trim() })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Unable to find your account.");
            return;
        }

        alert("Your Arogya Patra ID is: " + data.userId);

    } catch (error) {
        alert("Could not connect to the server.");
    }
}
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Reports - Arogya Patra</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f3f8f6;
}

.header {
    background: #176b5b;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-size: 28px;
}

.dashboard-btn {
    background: white;
    color: #176b5b;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h2 {
    color: #176b5b;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #176b5b;
}

.file-info {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
}

.save-btn {
    width: 100%;
    margin-top: 30px;
    padding: 15px;
    background: #176b5b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

.save-btn:hover {
    opacity: 0.9;
}

.message {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    display: none;
}

.success {
    background: #e1f5ec;
    color: #176b5b;
}

.error {
    background: #ffe5e5;
    color: #b00020;
}

.note {
    margin-top: 8px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="header">

    <h1>🏥 Arogya Patra</h1>

    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

</div>


<div class="container">

    <h2>Add Medical Reports</h2>

    <form id="reportForm">

        <label for="hospital">
            Hospital Name
        </label>

        <input
            type="text"
            id="hospital"
            placeholder="Enter hospital name"
            required
        >


        <label for="doctor">
            Doctor Name
        </label>

        <input
            type="text"
            id="doctor"
            placeholder="Enter doctor name"
            required
        >


        <label for="testName">
            Test Name
        </label>

        <select id="testName" required>

            <option value="">
                -- Select Test --
            </option>

            <option value="Blood Test">
                Blood Test
            </option>

            <option value="MRI">
                MRI
            </option>

            <option value="ECG">
                ECG
            </option>

            <option value="2D-3D Echo">
                2D-3D Echo
            </option>

            <option value="X-Ray">
                X-Ray
            </option>

            <option value="CT Scan">
                CT Scan
            </option>

            <option value="Ultrasound">
                Ultrasound
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <div class="note">
            Select only one test for this report.
        </div>


        <label for="customTest">
            If "Other" is selected, enter test name
        </label>

        <input
            type="text"
            id="customTest"
            placeholder="Enter test name"
            disabled
        >


        <label for="visitDate">
            Visit Date
        </label>

        <input
            type="date"
            id="visitDate"
            required
        >


        <label for="reports">
            Select Medical Reports
        </label>

        <input
            type="file"
            id="reports"
            multiple
            required
        >

        <div
            class="file-info"
            id="fileInfo">
            You can select multiple files for this one test.
        </div>


        <button
            type="submit"
            class="save-btn">
            Save Reports
        </button>

    </form>


    <div
        id="message"
        class="message">
    </div>

</div>


<script>

const reportForm =
    document.getElementById("reportForm");

const testName =
    document.getElementById("testName");

const customTest =
    document.getElementById("customTest");

const reportsInput =
    document.getElementById("reports");

const fileInfo =
    document.getElementById("fileInfo");

const message =
    document.getElementById("message");


// ======================================
// ENABLE CUSTOM TEST NAME
// ======================================

testName.addEventListener("change", function() {

    if (this.value === "Other") {

        customTest.disabled = false;
        customTest.required = true;

    } else {

        customTest.disabled = true;
        customTest.required = false;
        customTest.value = "";
    }

});


// ======================================
// SHOW FILE COUNT
// ======================================

reportsInput.addEventListener(
    "change",
    function() {

        if (this.files.length === 0) {

            fileInfo.innerText =
                "You can select multiple files for this one test.";

            return;
        }

        fileInfo.innerText =
            this.files.length +
            " report file(s) selected for this test.";

    }
);


// ======================================
// SAVE REPORT
// ======================================

reportForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const patientId =
            localStorage.getItem("patientId");

        if (!patientId) {

            alert("Please login first.");

            window.location.href =
                "login.html";

            return;
        }


        const hospital =
            document
            .getElementById("hospital")
            .value
            .trim();


        const doctor =
            document
            .getElementById("doctor")
            .value
            .trim();


        let selectedTest =
            testName.value;


        const visitDate =
            document
            .getElementById("visitDate")
            .value;


        // If Other is selected
        if (selectedTest === "Other") {

            selectedTest =
                customTest.value.trim();

        }


        if (
            !hospital ||
            !doctor ||
            !selectedTest ||
            !visitDate
        ) {

            showMessage(
                "Please fill all details.",
                "error"
            );

            return;
        }


        if (reportsInput.files.length === 0) {

            showMessage(
                "Please select at least one report file.",
                "error"
            );

            return;
        }


        const formData =
            new FormData();


        formData.append(
            "userId",
            patientId
        );


        formData.append(
            "hospital",
            hospital
        );


        formData.append(
            "doctor",
            doctor
        );


        formData.append(
            "testName",
            selectedTest
        );


        formData.append(
            "visitDate",
            visitDate
        );


        // Add all files to this ONE test
        for (
            let i = 0;
            i < reportsInput.files.length;
            i++
        ) {

            formData.append(
                "reports",
                reportsInput.files[i]
            );

        }


        try {

            const response =
                await fetch(
                    "/save-report",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Could not save report.",
                    "error"
                );

                return;
            }


            showMessage(
                "Saved successfully: " +
                data.reportName,
                "success"
            );


            reportForm.reset();

            customTest.disabled = true;
            customTest.required = false;

            fileInfo.innerText =
                "You can select multiple files for this one test.";

        }

        catch (error) {

            showMessage(
                "Could not connect to the server.",
                "error"
            );

        }

    }
);


// ======================================
// MESSAGE
// ======================================

function showMessage(text, type) {

    message.innerText = text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}

</script>

</body>
</html>
